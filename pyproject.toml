[project]
name = "server"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "supabase (>=2.31.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "clerk-backend-api (>=7.0.0,<8.0.0)",
    "boto3 (>=1.43.84,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "langchain (>=1.4.0,<2.0.0)",
    "langchain-community (==0.4.1)",
    "langchain-openai (>=1.6.0,<2.0.0)",
    "unstructured[all-docs] (==0.18.11)",
    "scrapingbee (>=2.2.0,<3.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "ddgs (>=9.16.0,<10.0.0)",
    "langchain-tavily (>=0.2.18,<0.3.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "torch (>=2.13.0,<2.14.0)",
    "torchvision (>=0.20.0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
torchvision = {source = "pytorch-cpu"}

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
